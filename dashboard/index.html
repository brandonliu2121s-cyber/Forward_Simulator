        <div class="field"><label for="g-sp">Opening position (${u})</label><input id="g-sp" type="number" step="1" data-gnum="start_pos" value="${S.glob.start_pos}"></div>
        <div class="field"><label>Loss-limit stop-out</label><label class="toggle"><input type="checkbox" data-glob="halt_on_loss" ${S.glob.halt_on_loss === 1 ? 'checked' : ''}>Halt quoting after a breach</label></div></div></section></div>
      ${cloudCard()}
      <section class="card cta"><div><h3>${S.ran ? 'Ready to refresh?' : 'Ready to run?'}</h3><p class="muted" style="margin:4px 0 0">${esc(S.inst)} · ${plural(S.zs.length, 'client request', 'client requests')} · ${esc(S.seedNote)}${Object.keys(S.over).length ? ' · ' + plural(Object.keys(S.over).length, 'override', 'overrides') : ''}</p></div><span style="flex:1"></span>${runBtn}</section>`;
  }

  // ------------------------------------------------------------------ saved runs (Supabase; only when dashboard/config.json exists)
  function cloudCard() {
    if (!ST.enabled) return '';
    const c = S.cloud, user = ST.user(), dis = c.busy ? ' disabled' : '';
    const fmtDate = (iso) => { const d = new Date(iso); return Number.isNaN(+d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };
    let body;
    if (!user) {
      body = `<p class="muted" style="margin:4px 0 12px">Sign in with your email to save setups and reopen them later. You get a one-time link by email, no password.</p>
        <div class="cloudrow"><input id="cl-email" type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email address" data-cloudfield="email" data-cloudenter="cloudin" value="${esc(c.email)}"><button class="btn orange" data-act="cloudin"${dis}>Email me a link</button></div>`;
    } else {
      const runs = c.runs;
      const list = runs == null ? '<p class="muted">Loading your runs…</p>' : !runs.length ? '<p class="muted">Nothing saved yet. Name this setup and press Save.</p>'
        : `<ul class="runs">${runs.map((r) => {
          const sm = r.summary || {}, pnl = Number.isFinite(+sm.pnl) ? `${money(+sm.pnl, pnlDec(+sm.pnl))} ${esc(String(sm.ccy || '').slice(0, 6))}` : '';
          const del = c.confirm === r.id;
          return `<li class="run"><div class="rn"><b>${esc(r.name)}</b><span class="muted">${esc(r.instrument)}${pnl ? ' · ' + pnl : ''}${fmtDate(r.created_at) ? ' · ' + fmtDate(r.created_at) : ''}</span></div>
            <button class="btn" data-act="cloudload" data-id="${esc(r.id)}"${dis}>Load</button>
            <button class="btn${del ? ' danger' : ''}" data-act="clouddel" data-id="${esc(r.id)}" aria-label="${del ? 'Confirm delete ' : 'Delete '}${esc(r.name)}"${dis}>${del ? 'Confirm' : 'Delete'}</button></li>`; }).join('')}</ul>`;
      body = `<div class="cloudrow"><input id="cl-name" type="text" maxlength="80" placeholder="${esc(S.inst)} · ${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}" aria-label="Name for this run" data-cloudfield="name" data-cloudenter="cloudsave" value="${esc(c.name)}"><button class="btn orange" data-act="cloudsave"${dis}>Save this setup</button></div>
        <h4 class="sub">${runs && runs.length ? plural(runs.length, 'saved run', 'saved runs') : 'Your saved runs'}</h4>${list}`;
    }
    return `<section class="card cloud" aria-label="Saved runs"><div class="card-head"><h3>Saved runs</h3><span class="sp"></span>${user ? `<span class="muted mail" title="${esc(user.email)}">${esc(user.email)}</span><button class="btn" data-act="cloudout"${dis}>Sign out</button>` : ''}</div>
      ${body}<p class="muted note" role="status" aria-live="polite">${esc(c.note)}</p></section>`;
  }
  async function cloudDo(fn, okNote) {
    const c = S.cloud; c.busy = true; c.note = ''; render();
    try { const r = await fn(); if (okNote) c.note = typeof okNote === 'function' ? okNote(r) : okNote; }
    catch (e) { c.note = e && e.message ? e.message : 'Something went wrong.'; if (e && e.status === 401) c.runs = null; }
    c.busy = false; render();
  }
  const cloudRefresh = async () => { S.cloud.runs = await ST.list(); };
  function cloudSave() {
    const c = S.cloud, name = (c.name || '').trim() || `${S.inst} · ${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}`;
    const doc = JSON.parse(IO.exportSessionJSON({ instrument: S.inst, definition: C.inst, overrides: S.over, globals: S.glob, scenario: { seed: S.seed, note: S.seedNote, zs: S.zs, acts: S.acts }, summary: C.sum, rows: C.rows }));
    delete doc.steps;   // the rows are recomputed on load; keep the stored document small
    const summary = { pnl: C.sum.cum, ccy: C.inst.pnl, steps: C.sum.n, risk: C.sum.risk, health: C.sum.health };
    return cloudDo(async () => { await ST.save({ name, instrument: S.inst, session: doc, summary }); c.name = ''; await cloudRefresh(); }, `Saved “${name.slice(0, 40)}”.`);
  }
  function cloudLoad(id) {
    return cloudDo(async () => {
      const row = await ST.get(id);
      const r = IO.parseImport(JSON.stringify(row.session), 'saved-run.json');
      if (r.kind !== 'session' || (r.errors && r.errors.length)) throw new Error('That saved run could not be read: ' + ((r.errors && r.errors[0]) || 'unknown format'));
      const msg = applySession(r, scenarioSetter);
      if (!msg) throw new Error('That run uses an instrument that is not in this library.');
      return row.name;
    }, (n) => `Loaded “${String(n).slice(0, 40)}”.${S.ran ? '' : ' Press Run simulation to see the results.'}`);
  }

  function viewGate() {
    const name = RESULT_VIEWS[S.view];
    return `<div class="page-head"><div><h2>${name}</h2><p>Nothing to show yet.</p></div></div>
      <section class="card gate"><h3>Enter your inputs first</h3><p class="muted" style="margin:6px 0 14px">Set up the instrument and risk limits, then run the simulation. The charts, pricing and advice for ${esc(S.inst)} will appear here.</p><button class="btn orange" data-act="view" data-v="setup">Go to Setup</button></section>`;
  }

  // ------------------------------------------------------------------ data dialog (import / export)
  const DL = { open: false, tab: 'export', what: 'run', fmt: 'csv', text: '', parsed: null, bundle: null, fresh: false };
  let outTimer = null;
  let toastTimer = null;
  let toastHide = null;
  function toast(msg) {
    const el = $('#toast');
    clearTimeout(toastTimer); clearTimeout(toastHide);
    el.textContent = msg; el.classList.remove('out'); el.hidden = false;
    toastTimer = setTimeout(() => { el.classList.add('out'); toastHide = setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 170); }, 5000);
  }
  const slug = (x) => String(x).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'data';
  const WHATS = [
    ['run', 'Run results', 'Every step: quotes, fills, P&L and hedges (CSV or JSON)'],
    ['scenario', 'Scenario only', 'Market moves and client actions. The CSV pastes into the Excel Simulation sheet'],
    ['session', 'Full session', 'Instrument, overrides, settings, scenario and results (JSON)'],
    ['library', 'Instrument library', 'All instruments, including any you imported (CSV or JSON)'],
  ];
  const EXAMPLES = {
    scenario: 'step,move_sigma,action\n1,1.5,NONE\n2,-1.2,BUY\n3,0.4,SELL\n4,-0.8,SELL\n5,2.1,BUY\n',
    library: IO.exportLibraryCSV([{ name: 'Example Corn', type: 'Commodity', unit: 'bu', pnl: 'USD', note: 'Example row with illustrative values',
      params: { spot_init: 4.5, rate_a: 0.02, rate_b: 0.06, basis_a: 365, basis_b: 365, tenor_days: 90, tick: 0.0025, clip: 5000, spread_ticks: 4, max_skew_ticks: 3, pos_limit: 20000, loss_limit: 2400, hedge_cost_ticks: 1, step_vol_ticks: 8 } }]),
  };
  const CHEAT = `Scenario (CSV)      step,move_sigma,action        move = market move in 1-sigma units (-10..10)
                    1,1.5,NONE                   action = BUY, SELL or NONE
                    Columns A:C of the Excel Simulation sheet paste straight in.
Scenario (JSON)     {"moves":[1.5,-1.2],"actions":["NONE","BUY"]}
Instruments (CSV)   name,type,unit,pnl,spot,rate_a,rate_b,basis_a,basis_b,tenor_days,tick,clip,
                    spread_ticks,max_skew_ticks,pos_limit,loss_limit,hedge_cost_ticks,step_vol_ticks,note
                    type = FX or Commodity. Rates as fractions (0.04) or percents (4%).
                    An Excel Instruments sheet saved as CSV also imports.
Instruments (JSON)  {"instruments":[{"name":"...","type":"FX", ...}]}
Session (JSON)      The "Full session" export. Restores instrument, overrides, settings and scenario.`;

  function exportBundle() {
    const what = DL.what, fmt = what === 'session' ? 'json' : DL.fmt, sc = { seed: S.seed, note: S.seedNote, zs: S.zs, acts: S.acts };
    let text;
    if (what === 'run') text = fmt === 'csv' ? IO.exportRunCSV(C.rows) : IO.exportRunJSON({ instrument: S.inst, unit: C.inst.unit, pnl: C.inst.pnl, params: C.p, globals: S.glob, summary: C.sum }, C.rows);
    else if (what === 'scenario') text = fmt === 'csv' ? IO.exportScenarioCSV(S.zs, S.acts) : IO.exportScenarioJSON(sc);
    else if (what === 'library') text = fmt === 'csv' ? IO.exportLibraryCSV(D.instruments) : IO.exportLibraryJSON(D.instruments);
    else text = IO.exportSessionJSON({ instrument: S.inst, definition: C.inst, overrides: S.over, globals: S.glob, scenario: sc, summary: C.sum, rows: C.rows });
    return { text, fmt, name: (what === 'library' ? 'forward-desk_library' : `forward-desk_${slug(S.inst)}_${what}`) + '.' + fmt, mime: fmt === 'csv' ? 'text/csv' : 'application/json' };
  }
  function renderDialog() {
    const el = $('#dlg');
    document.documentElement.style.overflow = DL.open ? 'hidden' : '';
    if (!DL.open) { el.innerHTML = ''; return; }
    const exp = DL.tab === 'export';
    let body;
    if (exp) {
      const b = (DL.bundle = exportBundle());
      body = `<div class="opts" role="radiogroup" aria-label="What to export">${WHATS.map(([k, l, d]) => `<button class="opt" role="radio" aria-checked="${DL.what === k}" data-act="dlgwhat" data-k="${k}"><b>${l}</b><span>${d}</span></button>`).join('')}</div>
        <div class="fmtrow"><span class="muted">Format</span><span class="tabs" role="group" aria-label="Format"><button data-act="dlgfmt" data-k="csv" aria-pressed="${b.fmt === 'csv'}" ${DL.what === 'session' ? 'disabled' : ''}>CSV</button><button data-act="dlgfmt" data-k="json" aria-pressed="${b.fmt === 'json'}">JSON</button></span><span class="dim" id="exp-meta"></span></div>
        <textarea id="exp-text" class="mono-area" readonly spellcheck="false" aria-label="Export text"></textarea>
        <div class="dlg-actions"><button class="btn primary" data-act="dlgdl">Download ${esc(b.name)}</button><button class="btn" data-act="dlgcopy">Copy to clipboard</button></div>
        <p class="dim" style="margin:0">Downloads can be blocked when this page is embedded or sandboxed. Copy always works: paste into a .${b.fmt} file.</p>`;
    } else {
      body = `<div id="dropzone" class="drop"><p style="margin:0 0 8px"><b>Drop a .csv or .json file here</b>, or</p><input type="file" id="imp-file" data-file accept=".csv,.json,.txt,text/csv,application/json" aria-label="Choose a file to import"></div>
        <label class="lab" for="imp-text">Or paste text</label><textarea id="imp-text" class="mono-area" data-imptext spellcheck="false" placeholder="Paste CSV or JSON here" style="min-height:130px"></textarea>
        <div class="dlg-actions"><button class="btn" data-act="dlgexample" data-k="scenario">Fill example scenario</button><button class="btn" data-act="dlgexample" data-k="library">Fill example instrument</button><button class="btn" data-act="dlgreset">Restore built-in instruments</button></div>
        <div id="imp-prev" aria-live="polite"></div>
        <details class="fmt"><summary>Accepted formats</summary><pre>${esc(CHEAT)}</pre></details>`;
    }
    el.innerHTML = `<div class="backdrop${DL.fresh ? ' fresh' : ''}" data-act="dlgclose"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div class="card-head"><h2 id="dlg-title">Import / Export</h2><span class="sp"></span>
      <span class="tabs" role="group" aria-label="Mode"><button data-act="dlgtab" data-k="export" aria-pressed="${exp}"${exp && DL.rise ? ' class="rise"' : ''}>Export</button><button data-act="dlgtab" data-k="import" aria-pressed="${!exp}"${!exp && DL.rise ? ' class="rise"' : ''}>Import</button></span>
      <button class="iconbtn x" data-act="dlgclose" aria-label="Close">${ico('x')}</button></div>${body}</div></div>`;
    DL.fresh = false; DL.rise = false;
    if (exp) {
      $('#exp-text').value = DL.bundle.text;
      $('#exp-meta').textContent = `${plural(DL.bundle.text.split('\n').length - 1, 'line', 'lines')}, ${(DL.bundle.text.length / 1024).toFixed(1)} KB`;
    } else {
      $('#imp-text').value = DL.text; renderPreview();
      const dz = $('#dropzone');
      dz.addEventListener('dragover', (ev) => { ev.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('over'));
      dz.addEventListener('drop', (ev) => { ev.preventDefault(); dz.classList.remove('over'); readFile(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]); });
    }
  }
  function renderPreview() {
    const el = $('#imp-prev'); if (!el) return;
    const r = DL.parsed;
    if (!r) { el.innerHTML = ''; return; }
    const li = (arr, cls) => arr.slice(0, 8).map((m) => `<li class="${cls}">${esc(m)}</li>`).join('') + (arr.length > 8 ? `<li class="${cls}">...and ${arr.length - 8} more</li>` : '');
    let head = 'This could not be imported.', can = false;
    if (r.kind === 'scenario') {
      const b = r.acts.filter((x) => x === 'BUY').length, sl = r.acts.filter((x) => x === 'SELL').length;
      head = `Scenario with <b>${r.zs.length}</b> steps: ${b} buy, ${sl} sell, ${r.zs.length - b - sl} no trade.`; can = !r.errors.length;
    } else if (r.kind === 'library') {
      const ex = r.instruments.filter((i) => D.instruments.some((x) => x.name === i.name)).length;
      head = `Instrument library with <b>${r.instruments.length}</b> valid instrument${r.instruments.length === 1 ? '' : 's'} (${r.instruments.length - ex} new, ${ex} replacing existing)${r.skipped ? `. ${r.skipped} skipped` : ''}.`;
      can = r.instruments.length > 0;
    } else if (r.kind === 'session') {
      const known = D.instruments.some((i) => i.name === r.instrument) || !!r.definition;
      head = `Session for <b>${esc(r.instrument)}</b>${r.scenario ? ` with a ${r.scenario.zs.length}-step scenario` : ''}, ${Object.keys(r.overrides).length} override${Object.keys(r.overrides).length === 1 ? '' : 's'}.`;
      can = !r.errors.length && known;
      if (!known && !r.errors.length) r.errors.push(`Instrument "${r.instrument}" is not in the library and the file does not define it.`);
    }
    el.innerHTML = `<div class="prev ${can ? 'ok' : 'bad'}"><p>${head}</p><ul>${li(r.errors, 'err')}${li(r.warnings || [], 'warn')}</ul>${can ? '<button class="btn orange" data-act="dlgapply">Apply import</button>' : ''}</div>`;
  }
  function onImportText(text, fname) {
    DL.text = text;
    DL.parsed = text.trim() ? IO.parseImport(text, fname) : null;
    renderPreview();
  }
  function readFile(file) {
    if (!file) return;
    if (file.size > IO.MAX_BYTES) { DL.text = ''; DL.parsed = { kind: null, errors: ['That file is over 2 MB, which is more than this tool will read.'], warnings: [] }; $('#imp-text').value = ''; renderPreview(); return; }
    const fr = new FileReader();
    fr.onload = () => { const txt = String(fr.result); $('#imp-text').value = txt; onImportText(txt, file.name); };
    fr.onerror = () => { DL.parsed = { kind: null, errors: ['Could not read that file.'], warnings: [] }; renderPreview(); };
    fr.readAsText(file);
  }
  const scenarioSetter = (sc, note) => { S.zs = sc.zs.slice(); S.acts = sc.acts.slice(); S.seed = sc.seed == null ? null : sc.seed; S.seedNote = note; S.pin = null; };
  function applyImport() {
    const r = DL.parsed; if (!r || !r.kind) return;
    const setScenario = scenarioSetter;
    let msg = '';
    if (r.kind === 'scenario') { setScenario(r, 'Imported scenario'); msg = `Scenario loaded: ${r.zs.length} steps.`; }
    else if (r.kind === 'library') {
      let add = 0, upd = 0;
      r.instruments.forEach((i) => { const k = D.instruments.findIndex((x) => x.name === i.name); if (k >= 0) { D.instruments[k] = i; upd++; if (i.name === S.inst) S.over = {}; } else { D.instruments.push(i); add++; } });
      S.search = '';
      msg = `Instruments imported: ${add} new, ${upd} updated.`;
    } else if (r.kind === 'session') {
      msg = applySession(r, setScenario);
      if (!msg) return;
    }
    closeDialog(); render(); toast(msg);
  }
  /* shared by the file importer and Saved runs; returns the toast text, or '' if the instrument is unknown */
  function applySession(r, setScenario) {
    let inst = D.instruments.find((i) => i.name === r.instrument);
    if (!inst && r.definition) { D.instruments.push(r.definition); inst = r.definition; }
    if (!inst) return '';
    S.inst = inst.name; S.over = Object.assign({}, r.overrides); S.glob = Object.assign({}, D.globals, r.globals);
    if (r.scenario) setScenario(r.scenario, r.scenario.note || 'Imported session');
    S.pin = null;
    return `Session loaded: ${inst.name}.`;
  }
  /* Mouse close: 140ms exit. Escape / keyboard close: instant (keyboard actions are never animated). */
  function closeDialog(instant) {
    if (!DL.open) return;
    DL.open = false; document.documentElement.style.overflow = '';
    const bd = $('.backdrop');
    if (instant || !bd) { $('#dlg').innerHTML = ''; return; }
    bd.classList.add('out'); clearTimeout(outTimer);
    outTimer = setTimeout(() => { if (!DL.open) $('#dlg').innerHTML = ''; }, 150);
  }
  async function download(b) {
    // Inside the Claude artifact viewer, plain downloads are blocked: the viewer offers a save prompt through the downloads capability.
    let cap = null;
    try { cap = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (_) { cap = null; }
    if (cap) {
      try { await cap.save({ filename: b.name, data: b.text }); toast(`Download started: ${b.name}`); return; }
      catch (err) {
        const c = err && err.code;
        if (c === 'declined') return toast('Download cancelled.');
        if (c === 'rate_limited') return toast('Another save prompt is open. Finish it, then try again.');
        if (c !== 'unavailable' && c !== 'not_granted' && c !== 'capability_disabled' && c !== 'capability_removed') return toast('Could not save the file. Use Copy instead.');
      }

      const url = URL.createObjectURL(new Blob([b.text], { type: b.mime + ';charset=utf-8' }));

      setTimeout(() => URL.revokeObjectURL(url), 2000);

  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast('Copied to clipboard.'); }
    catch (_) { const ta = $('#exp-text'); if (ta) { ta.focus(); ta.select(); } toast('Text selected. Press Ctrl or Cmd + C to copy.'); }
  }
  function dialogClick(a, t, e) {
    if (a === 'dlgclose' && t.classList.contains('backdrop') && e.target !== t) return;
    if (a === 'data') {
      clearTimeout(outTimer); DL.open = true; DL.fresh = e.detail !== 0; DL.tab = t.dataset.tab || DL.tab; if (t.dataset.what) DL.what = t.dataset.what;
      if (DL.tab === 'import') { DL.text = ''; DL.parsed = null; }

      D.instruments = JSON.parse(JSON.stringify(BUILTIN));
      if (!D.instruments.some((i) => i.name === S.inst)) { S.inst = D.default; S.over = {}; }
      render(); return toast('Built-in instruments restored.');
    }
  }

  // ------------------------------------------------------------------ render + events
  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => requestAnimationFrame(() => { const el = $('#plot'); if (el && (!drawn || Math.max(260, el.clientWidth) !== drawn.W || Math.max(200, el.clientHeight) !== drawn.H)) drawHero(); })) : null;   // the observer's first callback must not redraw (it would cut the reveal short)
  function render() {
    compute();
    const v = (!S.ran && S.view !== 'setup' ? viewGate : { setup: viewSetup, desk: viewDesk, pricing: viewPricing, instruments: viewInstruments, activity: viewActivity }[S.view])();
    $('#app').innerHTML = header() + '<main class="' + (S.intro ? 'enter' : '') + '" style="display:grid;gap:12px">' + v + '</main><div class="foot">Illustrative levels, simulated clients and a simplified model. Educational use only, not trading advice.</div>';
    S.intro = false; S.popAnim = false; S.tabAnim = false;
    const play = S.ran && S.fresh[S.view]; if (play) S.fresh[S.view] = false;
    if (ro) ro.disconnect();
    if (S.view === 'desk' && S.ran) {
      drawHero();
      if (ro) ro.observe($('#plot'));

    }
    if (play) playReveal(S.view);
  }

  /* ---- chart reveal: after Run, and whenever the inputs change, the visuals build up slowly so the change is easy to follow.
     Web Animations (compositor-friendly, cancelled when finished). Reduced motion: a short fade, no wipes and no count-up. */
  const REVEAL_EASE = 'cubic-bezier(0.77, 0, 0.175, 1)', REVEAL_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
  function countUp(el, ms, delay) {
    const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n; (n = w.nextNode());) {
      const txt = n.nodeValue, toks = [];
      txt.replace(/\d[\d,]*(?:\.\d+)?/g, (m, i) => { toks.push({ i, m, v: parseFloat(m.replace(/,/g, '')), dec: (m.split('.')[1] || '').length, grp: m.includes(',') }); return m; });
      if (toks.length && txt.length < 24 && !/e\+/.test(txt) && toks.every((t) => Number.isFinite(t.v))) nodes.push({ n, txt, toks });
    }

    const fmt = (t, x) => { const f = x.toFixed(t.dec); return t.grp ? Number(f).toLocaleString('en-US', { minimumFractionDigits: t.dec, maximumFractionDigits: t.dec }) : f; };
    const t0 = performance.now() + delay;
    const tick = (now) => {

      if (k < 1) requestAnimationFrame(tick);
    };
    nodes.forEach(({ n, toks, txt }) => { let out = '', at = 0; toks.forEach((t) => { out += txt.slice(at, t.i) + fmt(t, 0); at = t.i + t.m.length; }); n.nodeValue = out + txt.slice(at); });
    requestAnimationFrame(tick);
  }
  let revealTimer = 0;
  function playReveal(view) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const root = document.documentElement; root.dataset.reveal = 'on'; clearTimeout(revealTimer);
    revealTimer = setTimeout(() => { delete root.dataset.reveal; }, reduce ? 500 : 3200);   // lets tests (and anything else) know when the numbers have settled
    const go = (el, frames, o) => { if (!el || !el.animate) return; const a = el.animate(frames, Object.assign({ fill: 'both', easing: REVEAL_OUT }, o)); a.onfinish = () => { try { a.cancel(); } catch (_) {} }; return a; };
    const fade = { opacity: [0, 1] };

      [...document.querySelectorAll('.bar .fill')].forEach((el, i) => reduce ? go(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 250 })
        : go(el, [{ clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 900, delay: 350 + i * 110 }));
      rise([...document.querySelectorAll('.bar .above')], 900, 110);
      const arc = $('.g-arc'); if (arc) { if (reduce) go(arc, [{ opacity: 0 }, { opacity: 1 }], { duration: 250 }); else go(arc, [{ strokeDasharray: '0 1' }, { strokeDasharray: '1 0' }], { duration: 1100, delay: 450, easing: REVEAL_EASE }); }
      [...document.querySelectorAll('.g-end')].forEach((el) => go(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: reduce ? 0 : 1300 }));
      rise([...document.querySelectorAll('.health i.on')], 200, 22);
      rise([...document.querySelectorAll('.insight .body p, .insight .evchip')], 1000, 160);
      if (!reduce) [...document.querySelectorAll('.left .big, .tile.kpi .val, #hero-val, .risk .score b, .health b')].forEach((el, i) => countUp(el, 1400, 120 + (i % 5) * 40));
    } else if (view === 'pricing') {
      rise([...document.querySelectorAll('table.recipe tr, table.t tbody tr')], 120, reduce ? 0 : 35);
      if (!reduce) [...document.querySelectorAll('.ubar i')].forEach((el, i) => { el.style.transformOrigin = el.style.left ? 'left' : 'right'; go(el, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 700, delay: 300 + i * 40 }); });
    }
  }
  const setView = (v) => { if (VIEWS.some((x) => x[0] === v)) { S.view = v; S.pop = null; try { history.replaceState(null, '', '#' + v); } catch (_) {} render(); window.scrollTo(0, 0); } };
  function newScenario(seed) {
    const g = E.generateScenario(seed, S.zs.length);
    S.zs = g.zs; S.acts = g.acts; S.seed = seed; S.seedNote = 'Browser scenario'; S.pin = null;
  }
  function setSteps(n) {
    n = Math.max(10, Math.min(500, Math.round(n) || 60));
    if (n < S.zs.length) { S.zs.length = n; S.acts.length = n; }
    else if (n > S.zs.length) { const g = E.generateScenario((S.seed || 1) + 7, n); S.zs = S.zs.concat(g.zs.slice(S.zs.length)); S.acts = S.acts.concat(g.acts.slice(S.acts.length)); }
    S.pin = null;
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) { if (S.pop && !e.target.closest('.pop')) { S.pop = null; render(); } return; }
    const a = t.dataset.act;
    if (a === 'data' || a.startsWith('dlg')) return dialogClick(a, t, e);
    if (a === 'cloudin') { return cloudDo(() => ST.signInWithEmail(S.cloud.email, location.origin + location.pathname), 'Check your inbox for the sign-in link. It opens this page signed in.'); }
    if (a === 'cloudout') { return cloudDo(async () => { await ST.signOut(); S.cloud.runs = null; }, 'Signed out.'); }
    if (a === 'cloudsave') return cloudSave();
    if (a === 'cloudload') return cloudLoad(t.dataset.id);
    if (a === 'clouddel') {
      if (S.cloud.confirm !== t.dataset.id) { S.cloud.confirm = t.dataset.id; return render(); }   // first click arms it, second deletes
      S.cloud.confirm = null; return cloudDo(async () => { await ST.remove(t.dataset.id); await cloudRefresh(); }, 'Deleted.');
    }
    if (a === 'run') { S.ran = true; S.intro = true; S.fresh = { desk: 1, pricing: 1 }; S.pin = null; S.pop = null; return setView('desk'); }   // results pop in with the stagger and the chart reveal (Run is a deliberate one-off, so keyboard use animates too)
    if (a === 'view') { S.tabAnim = e.detail !== 0 && t.dataset.v !== S.view; return setView(t.dataset.v); }   // keyboard-initiated: no animation
    if (a === 'pop') { S.pop = S.pop === t.dataset.id ? null : t.dataset.id; S.popAnim = e.detail !== 0; return render(); }   // keyboard-initiated: no animation
    if (a === 'inst') { S.inst = t.dataset.name; S.over = {}; S.pin = null; S.pop = null; if (t.dataset.go) S.view = t.dataset.go; render(); return; }
    if (a === 'search') { S.view = 'instruments'; S.pop = null; render(); const s = $('#search'); if (s) s.focus(); return; }
    if (a === 'metric') { S.metric = t.dataset.m; S.pin = null; return render(); }
    if (a === 'range') { S.range = +t.dataset.r; S.pin = null; return render(); }
    if (a === 'barmode') { S.barMode = S.barMode === 'peak' ? 'end' : 'peak'; return render(); }
    if (a === 'bartable') { S.barTable = !S.barTable; return render(); }
    if (a === 'wlnext') { const wl = $('#wl'); wl.scrollBy({ left: wl.scrollLeft + wl.clientWidth >= wl.scrollWidth - 4 ? -wl.scrollWidth : 300, behavior: 'smooth' }); return; }
    if (a === 'reshuffle') { newScenario(Math.floor(Math.random() * 90000) + 1000); return render(); }
    if (a === 'excel') { S.zs = D.scenario.zs.slice(); S.acts = D.scenario.actions.slice(); S.seed = D.scenario.seed; S.seedNote = 'Excel scenario'; S.pin = null; return render(); }
    if (a === 'resetover') { S.over = {}; S.glob = Object.assign({}, D.globals); return render(); }
    if (a === 'cycle') { const i = +t.dataset.i, o = ['BUY', 'SELL', 'NONE']; S.acts[i] = o[(o.indexOf(S.acts[i]) + 1) % 3]; const sy = window.scrollY, sc = $('.scroll'), st = sc ? sc.scrollTop : 0; render(); window.scrollTo(0, sy); const n = $('.scroll'); if (n) n.scrollTop = st; return; }
    if (a === 'clip') { S.clips = Math.max(-8, Math.min(8, S.clips + +t.dataset.d)); return render(); }
    if (a === 'pinstep') { S.pin = +t.dataset.i; S.view = 'desk'; S.pop = null; S.range = 0; S.metric = 'pnl'; render(); const pl = $('#plot'); if (pl) pl.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && DL.open) { closeDialog(true); return; }
    if (e.key === 'Escape' && S.pop) { S.pop = null; render(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.clickable')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('keydown', (e) => {
    const f = e.target.dataset && e.target.dataset.cloudenter;
    if (f && e.key === 'Enter') { e.preventDefault(); const b = document.querySelector('[data-act="' + f + '"]'); if (b && !b.disabled) b.click(); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.cloudfield) { S.cloud[e.target.dataset.cloudfield] = e.target.value; return; }
    if (e.target.dataset && e.target.dataset.imptext !== undefined) { onImportText(e.target.value, ''); return; }
    if (e.target.id === 'search') { S.search = e.target.value; const pos = e.target.selectionStart; render(); const s = $('#search'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }
  });
  /* On Setup the number fields update in place: re-rendering on blur would swap the Run button out from under a click. */
  function patchField(t) {
    const k = t.dataset.field, ov = S.over[k] !== undefined, base = C.inst.params[k], sc = t.dataset.pct ? 100 : 1;
    t.classList.toggle('ov', ov);
    const sm = t.parentElement.querySelector('small');
    if (sm) sm.textContent = (ov ? 'Overridden' : 'Default') + ': ' + +(base * sc).toPrecision(10);
    refreshCta();
  }
  function refreshCta() {
    const p = document.querySelector('.cta .muted'); if (!p) return;
    const n = Object.keys(S.over).length;
    p.textContent = S.inst + ' · ' + plural(S.zs.length, 'client request', 'client requests') + ' · ' + S.seedNote + (n ? ' · ' + plural(n, 'override', 'overrides') : '');
  }
  document.addEventListener('change', (e) => {
    const t = e.target, keep = () => { const sy = window.scrollY; render(); window.scrollTo(0, sy); };
    if (t.dataset.file !== undefined) { readFile(t.files && t.files[0]); return; }
    if (t.dataset.field) {
      const k = t.dataset.field, raw = t.value.trim(), v = parseFloat(raw);
      if (raw === '' || Number.isNaN(v)) delete S.over[k]; else S.over[k] = t.dataset.pct ? v / 100 : v;
      if (S.view === 'setup') return patchField(t);
      return keep();
    }
    if (t.dataset.glob) { S.glob[t.dataset.glob] = t.checked ? 1 : 0; return keep(); }
    if (t.dataset.gpct) { const v = parseFloat(t.value); S.glob[t.dataset.gpct] = Number.isNaN(v) ? 0 : Math.max(0, Math.min(1, v / 100)); return S.view === 'setup' ? undefined : keep(); }
    if (t.dataset.gnum) { const v = parseFloat(t.value); S.glob[t.dataset.gnum] = Number.isNaN(v) ? 0 : v; return S.view === 'setup' ? undefined : keep(); }
    if (t.dataset.inst !== undefined) { S.inst = t.value; S.over = {}; S.pin = null; return keep(); }
    if (t.dataset.steps !== undefined) { setSteps(parseFloat(t.value)); if (S.view === 'setup') { t.value = S.zs.length; return refreshCta(); } return keep(); }
    if (t.dataset.z !== undefined) { const v = parseFloat(t.value); S.zs[+t.dataset.z] = Number.isNaN(v) ? 0 : v; const sy = window.scrollY, sc = $('.scroll'), st = sc ? sc.scrollTop : 0; render(); window.scrollTo(0, sy); const n = $('.scroll'); if (n) n.scrollTop = st; }
  });
  window.addEventListener('hashchange', () => { if (authFromHash()) { render(); if (ST.user()) cloudDo(cloudRefresh); return; } const v = location.hash.slice(1) === 'settings' ? 'setup' : location.hash.slice(1); if (v && v !== S.view) setView(v); });
  /* returning from the magic link: the hash carries the tokens; take them in and out of the address bar */
  function authFromHash() {
    if (!ST.enabled) return false;
    const r = ST.consumeRedirect(location.hash);
    if (!r) return false;
    try { history.replaceState(null, '', location.pathname + location.search + '#setup'); } catch (_) {}
    S.cloud.note = r.ok ? 'Signed in.' : r.error; S.view = 'setup';
    return true;
  }
  authFromHash();
  const h0 = location.hash.slice(1) === 'settings' ? 'setup' : location.hash.slice(1);
  if (VIEWS.some((x) => x[0] === h0)) { S.view = h0; S.ran = h0 !== 'setup'; }   // a deep link to a result view skips the setup step
  render();
  if (ST.enabled && ST.user()) cloudDo(cloudRefresh);   // signed in from an earlier visit or just now: load the list
})();
</script>
