name: Store live price snapshots
on:
  schedule:
    - cron: "17 * * * 1-5"      # hourly on weekdays (UTC); best effort, the free feeds are delayed and sometimes block cloud IPs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quotes and insert them into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 python/refresh_live.py --no-rebuild --push
