name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install openpyxl
      - run: python3 -m unittest discover -s tests -t .
      - run: python3 -m unittest discover -s commodity_sim/tests -t commodity_sim
